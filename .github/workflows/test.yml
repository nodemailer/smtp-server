name: Run tests

on:
    push:
    pull_request:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        strategy:
            fail-fast: false
            matrix:
                node: [20.x, 22.x, 24.x]
                os: [ubuntu-latest]
        runs-on: ${{ matrix.os }}
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js ${{ matrix.node }}
              uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm
            - run: npm install
            - run: npm run lint
            - run: npm run format:check
            - run: npm test
              if: matrix.node != '24.x'
            # on 24.x the suite runs once, under c8, which enforces the thresholds in .c8rc.json
            - name: Test with coverage check
              if: matrix.node == '24.x'
              run: npm run test:coverage

    # smtp-server is the test server of nodemailer, which also runs under Bun,
    # so the ES module build and the same test suite are run under the latest Bun release as well
    bun:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
            - name: Use Node.js 24.x
              uses: actions/setup-node@v7
              with:
                  node-version: 24.x
                  cache: npm
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - run: npm install
            - run: npm run test:bun
